[rules.biological_context_coverage]
# W3 is a candidate-set limitation, not a count of individual mismatched genes.
# Any qualified context-matched direct molecular or regulatory route prevents
# a global mismatch warning. Unknown biosamples, unmeasured candidates, and
# unfinished retrieval cannot prove that all candidates lack matching evidence.
# An undefined or unverifiable context is unassessed, not a W3 warning.
# Qualified coding/splice routes do not require a tissue measurement unless the
# task explicitly asks for a tissue-specific mechanism. No ranking is changed.
gate = "gate1"
severity = "warning"
display_group = "scientific_limitations"
role = "cause"
code = "W3"
depends_on = []
required_for = []
allow_hard_stop = false

