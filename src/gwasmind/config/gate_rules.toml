# Rules for input/evidence permissions (Gate 1) and generated-output validation (Gate 2).
# Scientific validator names and identity/ranking prerequisites are protected by the loader.
#
# Stop policy: an analysis stops only when the question cannot be answered at all,
# i.e. no source variant has a verifiable identity, no data is available, or (for
# gene prioritization) the lead window contains no candidate gene. These stops are
# operational receipts computed in code; no Gate 1 rule below can be a hard stop.
#
# severity = "warning": a limitation that can change the main conclusion (W code).
# severity = "note": recorded as a method note only; never a W and never a stop.
#
# Every rule has its own code. W1.x/W4.x share a family (W1, W4) that groups
# the displayed scientific warnings; saved reviews that carry only the family
# code remain readable.
#
# Gate 2 corrects uniquely grounded values and removes unsupported citations
# and identifiers. Ambiguous or unverifiable numbers remain unchanged and
# audited; impossible values require a safely identified complete assertion.
# It never adds a warning, downgrades report quality, or stops an analysis
# (loader-enforced).
version = "3.0.0"

[module_conditions]
complete = ["complete", "completed", "success", "no_data", "not_applicable"]
incomplete = ["missing", "unavailable", "blocked", "failed", "error", "partial", "truncated"]

