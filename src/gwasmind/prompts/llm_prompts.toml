role = "system_fragment"
purpose = "Mandatory Summary/Evidence/Limitations/References structure for every retrieval-backed answer."
# Metadata below is documentation/provenance only; only content is sent to the model.
stage = "retrieval_answer_format"
lifecycle = "runtime"
input_context = "The intent_detail string is loaded from one database_intent_* catalog entry."
