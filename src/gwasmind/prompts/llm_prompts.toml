content = '''
## 4. Evidence Card Field Guide

This compatibility representation uses locus, evidence_ledger, and evidence_projection instead of gene_comparison cards. locus describes the candidate IDs, query/source phenotypes, relevant_tissues and benchmark flag when supplied. The frozen candidate presentation order is not a precomputed rank.

Only the displayed evidence_ledger records authorize citations. Use each record's exact evidence_id and gene_id; preserve its variant, kind, study, tissue, measurements, provenance and source release. Context, statistics and raw payload fields retain their own meanings; a missing value remains unknown. Shared studies, proxies and annotations are not independent votes. Expression and other background data cannot establish a locus-to-gene link.

evidence_projection distinguishes full, deduplicated, displayed and omitted records. Audit-only member IDs cannot be cited. An omitted record is not evidence of biological absence, and a failed query is not a successful empty result. Do not claim to have reviewed undisplayed content.

Read any analysis_scope and per-record LD links together. Source GWAS statistics belong only to the selected source variants and source phenotype; proxy measurements stay attached to the proxy. Bind r2 to the recorded source/proxy pair, population and genome build; do not infer missing LD. window_bp is the distance on each side of each source, not total width or gene distance. Optional proxy gaps are scope limitations, not automatic scientific warnings when the selected source identity is valid. Incorrect or unsupported stated measurements remain factual errors.

