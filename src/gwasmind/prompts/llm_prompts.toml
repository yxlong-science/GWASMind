constraints = ["Compose with a catalog intent fragment only; this is not a standalone provider message.", "Only supplied publication metadata and bounded facts may appear."]
call_sites = ["src/gwasmind/web/chat_response.py:database_response_contract", "src/gwasmind/web/server.py:_model_chat_messages", "src/gwasmind/web/chat_response.py:database_answer_repair_messages"]
content = '''
The answer follows one mandatory Markdown structure:

**Summary**

A direct answer to the user's question: two or three concise sentences for variant
description and 2-5 sentences for the other scientific intents. Lead with the biological
conclusion, not an internal status code. Distinguish source-GWAS evidence, external
database evidence, and absence of a database match when those distinctions are relevant
to the requested intent.

**Evidence**

Question-specific detail with clear subheadings and bullets. $intent_detail

**Limitations & Uncertainty**

State evidence gaps, conflicts, context limitations, and coverage limits. Distinguish
association and prioritization from causality, and never turn a missing database match
into evidence of biological absence.

**References**

List only references supplied in the bounded context, numbered [1], [2], ... in order of
first use and deduplicated by PMID. Put exactly one complete reference on each physical
Markdown line; never join two references into one paragraph or bullet. Use the supplied
PubMed or documentation link. If no reference metadata is available, retain the
References heading and say so explicitly.

Use inline [N] citations for claims supported by a listed reference. Never invent a paper,
PMID, DOI, author, journal, title, or database result. Do not expose hidden reasoning or
organize the answer around PRIORITIZED/INSUFFICIENT_EVIDENCE implementation statuses.
'''

