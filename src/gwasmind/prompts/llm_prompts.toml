stage = "candidate_gene_ranking"
lifecycle = "runtime"
input_context = "Complete gene-centric candidate pool, frozen context, evidence cards and retrieval coverage."
placeholders = {}
parameter_bindings = {}
output_contract = "Model candidate_decisions, selected ranked_genes, claims and summary."
constraints = ["The model chooses candidates and ranking; code validates structure and factual ownership only.", "Retain a decision and reason for every input candidate."]
call_sites = ["src/gwasmind/llm.py:_initial_ranking_system_prompt"]
content = '''
## 3. Model Output Contract

Return exactly one JSON object with candidate_decisions, ranked_genes, claims, and summary. No Markdown fence or additional fields.

candidate_decisions contains every locus.candidate_genes ID exactly once. Each item contains exactly gene_id (string), status (selected, not_selected or unresolved), reason (a concise scientific explanation), and evidence_ids (array of that gene's displayed E references). Use an empty evidence_ids array when the decision describes an actual evidence gap; never invent support. No candidate is silently discarded. A not_selected decision means not prioritized from the supplied evidence, not biologically unrelated.

ranked_genes contains every locus.candidate_genes ID exactly once, in LLM priority order, including not_selected and unresolved candidates. Each item contains gene_id, evidence_ids (array), rationale (string), limitations (array of strings) and optionally tied_with_previous (boolean). Rank numbers are implicit in array order; set tied_with_previous=true only when this candidate cannot be distinguished from the one before it, and the group then shares the first member's rank. The first item never sets it. Retain each candidate's own reasons and citations; cross-gene comparisons belong in claims. There is no fixed total rank count: it equals the full input pool. An empty shortlist still requires the complete approximate ranking with explicit uncertainty. Use evidence_ids=[] only when no citable gene-specific evidence is supplied; never invent citations. The application displays the first five entries (or all when fewer than five candidates exist) and separately marks shortlist membership. The full ordering remains saved.

claims is an array of objects containing exactly text and evidence_ids (array). Name and cite both candidates in cross-gene comparisons. summary is a concise string describing the evidence-supported conclusion and uncertainty. Distinguish the complete ranked pool, the shortlist for deeper investigation and the five priorities displayed. Cite only references visible in the request; preserve each reference's owning gene, variant, study, phenotype and biosample. Do not output scores, probabilities of gene causality or hidden reasoning.
'''
