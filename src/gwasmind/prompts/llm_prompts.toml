constraints = ["Use supplied evidence with original identities and uncertainty.", "Do not create scores, new facts, tool calls, or additional output fields."]
call_sites = ["src/gwasmind/llm.py:_initial_ranking_system_prompt"]
content = '''
## 4. Evidence Card Field Guide

### Complete Scientific Fact Tables

The scientific fact view contains named tables with columns, rows and constant_fields.
Constants apply to every row in that table. Join study_ref, member_ref, variant_ref
and support_trace_ref by their IDs. E<n> evidence references identify original audited
records and may be cited in the existing evidence_ids fields; the application restores
their full identifiers. Other table row IDs, including LD<n>, are lookup keys,
not evidence_ids citations. For LD statements, name the exact source and proxy
variant IDs and use the recorded relationship values; do not put LD row IDs in
evidence_ids or borrow unrelated gene evidence to supply a citation.
Return only the original candidate gene IDs.

A table may explicitly declare encoding="named-column-value-references-v1".
Only columns declared in its column_values use this encoding. A column named
value_ref:<original column> contains a ONE-BASED index into that declaration's
values list; substitute that exact value under the declared original column.
The index is a reference, not a measurement, gene ID, evidence citation or count.
These dictionaries share exact categorical/object values only; numeric values
remain directly visible. Ordinary strings in undeclared columns remain literal.
Null cells remain missing fields; a null in constant_fields remains explicit null.

molecular_qtl may declare member_derived_columns. These are exact relationships
already verified for every row, not missing evidence or inferred measurements:
study_ref = member.study_ref; member_statistics_ref = member.id;
evidence_refs = the singleton list containing member.evidence_ref;
variant_ref = the unique variants.id whose variant_id equals member.variant_id;
qtl_type = that member study's study_type; support_trace_ref = the unique trace
whose variant_refs and member_refs contain only that variant and member.
Resolve these using the row's retained member_ref, after resolving column values.
The declaration's position restores the original column position. Only declared
columns are derived; other columns retain their supplied values and absences.
No study, variant, member, trace, evidence alias, measurement or row is removed.
Shared values and lookup paths are not additional independent scientific support.

Each credible_set_members row preserves its own exact variant-specific statistics.
When molecular_qtl.member_statistics_ref is present, join it to the matching
credible_set_members.id for beta, pValueExponent, pValueMantissa,
posteriorProbability and standardError. These are one set of measured values
shared by that QTL and its same-study, same-variant, same-gene evidence binding;
they are not missing measurements or an additional independent experiment.
Other statistics still on the QTL row retain their original meanings.
Resolve molecular_qtl.other_statistics_ref in reported_statistics_profiles.
That profile retains the original other_reported_statistics fields, scoped by
source_id, study_ref and gene_id. These OTHER values do not replace member
measurements, and must not be relabelled as the uploaded source GWAS P value.
Profiles with different values or missing fields are not interchangeable.
gene_annotations may contain groups named by evidence kind. Each group is its
own columns/rows/constant_fields table; constants apply only within that group.
All original annotation IDs and evidence references remain valid across groups.
When molecular_qtl.gene_from_study_ref is true, the row's gene_id is the gene_id
on its joined studies row; the gene identity has not been omitted or inferred.
For a gene_annotations row with subject_from_variant_ref=true, its subject is
the variant identified by variants[variant_ref].variant_id (type: variant).
With object_from_gene_context=true, its object is the row's gene_id with label
context.approved_symbol (type: target). These markers share exact identity fields;
they do not create a new gene link or turn a variant annotation into causal evidence.
Rows without a marker retain their explicit subject, object or gene_id fields.
H4 belongs to the recorded pair of study loci and colocalisation method. Different
values remain separate rows. Never pool member measurements, transfer a lead or proxy
statistic to another SNP, or count repeated LD lookup paths as independent support.
regulatory_evidence describes annotation entities; regulatory_variant_links binds each
entity through regulatory_ref to a selected/proxy variant and its exact query-specific
values. Cite the relationship evidence_refs for variant-specific claims; repeated
relationships are not additional independent annotation measurements.
Resolve studies.biosample_ref in biosamples (tissue, biosample_name, biosample_id) and
studies.publication_ref in publications (PMID and bibliographic metadata).
Resolve regulatory_evidence.interval_ref in regulatory_intervals for the original
coordinates, type and source field family. Resolve regulatory_variant_links.overlap_metrics_ref
in variant_overlap_metrics for that link's variant-specific measurements. Sharing
metadata never merges variant identities, study relationships or independent support.
The identity of each regulatory relationship still includes variant_ref, regulatory_ref,
study, source and gene. Regulatory annotation gene_id is on regulatory_evidence;
QTL and colocalisation study gene identities remain on their study rows.
resource_measurement.<name> retains the original named resource measurement, and
resource_measurement_names retains reported names and order. Resource arrays with
duplicate names or additional metadata remain in the statistics.resource_scores column.
Use the shared provenance relationships to distinguish selected-source measurements
from indirect LD support. Preserve the stated study, tissue, trait, population and
coverage limitations. Keep the existing ranked_genes, claims and summary output schema.

### Source Observations and Optional LD Scope

Keep source GWAS measurements attached to the selected source variant and source phenotype. An LD proxy's measurements are indirect support through the supplied source/proxy edge, not measurements of the source SNP. Bind every LD value to its exact source, proxy, population and reference build. The recorded window_bp is the distance on each side, not the total span or gene distance. A missing edge remains unknown. A valid source observation remains usable despite optional proxy gaps; do not convert those gaps into automatic scientific warnings. Treat retrieval, scientific-fact sharing and displayed-citation coverage separately; none establishes exhaustive biological coverage.
'''

[prompts.agent_gene_comparison_contract]
version = "3.1.0"
role = "system_fragment"
purpose = "Part 4: explain actual gene-comparison card fields, provenance, measurements, and display limits."
# Documentation stays outside content. Only the effective content below is sent.
# The initial request assembles Parts 1, 2, 3, then one Part 4 representation guide.
stage = "candidate_gene_ranking"
lifecycle = "runtime"
input_context = "ranking_gene_cards_v2 with uniform comparison_cards, availability, citation_records, sources, and coverage."
placeholders = {}
parameter_bindings = {}
output_contract = "Exactly one JSON object: ranked_genes (gene_id/evidence_ids/rationale/limitations), claims (text/evidence_ids), and summary."
constraints = ["Use supplied evidence with original identities and uncertainty.", "Do not create scores, new facts, tool calls, or additional output fields."]
call_sites = ["src/gwasmind/llm.py:_initial_ranking_system_prompt"]
content = '''
## 4. Evidence Card Field Guide

### Request Layout and Identity

The request contains locus, gene_comparison, and evidence_projection. locus defines the supplied candidate IDs, source_observations, query/source phenotypes, and the frozen biological context. The recorded evidence_projection.analysis_scope, when present, distinguishes selected-source observations from the broader LD-expanded analysis scope. Candidate presentation order is reproducibly randomized and conveys no evidence strength. Infer the gene order from scientific observations alone; neither presentation order nor citation numbering is a prior rank.

gene_comparison.format is ranking_gene_cards_v2. Each comparison_cards item uses the same fields: gene_id, gene_symbol, direct_molecular, regulatory_groups, positional_summary, background_summary, availability, and coverage. Empty lists and nulls preserve the schema without inventing evidence. citation_records is the citation allowlist; undisplayed ledger entries cannot be cited. citation_records contains the displayed record details; sources is a shared provenance dictionary keyed by source_ref. Frozen organ, tissue and cell concepts are mapped to reported biosample identities and explicitly recorded ontology relationships; this mapping describes context compatibility, not experimentally established phenotype relevance.

The provider-facing card may include model_compaction. This is a presentation optimization for repeated fields, not a gene or evidence filter. When a card's expression_profiles contains profile_ref, resolve it in gene_comparison.expression_profile_catalog.profiles. The referenced profile contains both tissue and cell axes, all context groups, context-matched measurements, specificity statistics, top reference-panel observations, and reference-panel summary statistics. Complete reference-panel rows remain in the scientific fact view and are not negative evidence when absent from this compact view. All colocalization citation records remain present. Their verbose context_assessment ontology trace is retained in the complete scientific facts; use the citation's context and molecular_context_assessment summary for the reported biosample, context class, tier, and phenotype scope.

Expression catalog version 4 shares biosamples, group_definitions, methods, selectors, schemas and table_constants across all candidates. All references are named dictionary keys, never array positions. For a table, use schemas[schema_ref].columns in order, excluding keys already supplied by table_constants[constant_ref]; zip the remaining columns with each row and restore the constants. Resolve biosample_ref, group_ref, method_ref and selector_ref in their named dictionaries; biosample_refs preserves the listed order. Dotted reference_panel_summary fields belong to that summary. Each scientific result retains its comparison scope and partial or unavailable reasons. Null means unknown, never zero. Partial descriptive statistics do not establish full-panel specificity; a separately complete qualified comparison remains usable.

For a large locus, citation_records may be a compact index. A colocalization index item has record_ref; look up that stable string key in gene_comparison.colocalization_record_catalog.rows, zip the result with columns, add the catalog's common_fields to every decoded row, then resolve each *_ref by its stable string key in the corresponding objects dictionary. Catalog keys are identities, never candidate-order positions. This is a lossless table encoding: it preserves the original phenotype, molecular QTL study, counterpart phenotype, H3/H4/CLPP, credible-set member, variant and LD fields. The index evidence_ref remains the citation identifier to use in the answer. Verification hashes and internal audit receipts are intentionally absent from the model-facing payload and must not be inferred or discussed.

Resolve a card item's evidence_refs to citation_records using evidence_ref. An E<n> alias identifies the corresponding displayed original evidence_id. fact_id joins a scientific fact; it is not a citation. Resolve citation_records.source_ref in gene_comparison.sources. Shared metadata and multiple references to one fact do not create additional observations.

### Molecular and Coding Evidence

Each card's direct_molecular contains molecular_qtl, colocalizations, and coding_splicing items. These items link to displayed records rather than supplying every measurement inline. Their retention describes this supplied evidence view; it does not establish exhaustive coverage of all studies or tissues.

A displayed molecular record may contain gene_id, qtl_type, study, statistics, other_reported_statistics, credible_set_member, variant, query_variant_role, method, finemapping_method, quality_controls, supports, provenance_complete, and confidence. Read only fields actually supplied; absent or null values remain unknown.

Read context and context_assessment together with the original study biosample. A matched context is compatible with the frozen phenotype context; other_reported_context is a reported biosample outside that mapping; context_unreported remains unknown. Additional molecular observations from other biosamples are valid measured evidence in their own contexts. They can support regulatory potential, but do not establish an effect in the phenotype-relevant tissue. Never relabel an unknown biosample as an unrelated tissue or transfer a tissue label between records. unreported_fields identifies unavailable source fields, not negative experimental findings.

The supported molecular QTL labels are eqtl, pqtl, sqtl, tuqtl, sceqtl, scpqtl, scsqtl, and sctuqtl: expression, protein, splicing, transcript-usage, and their corresponding single-cell study types. Preserve the reported subtype and measured molecular trait rather than collapsing them into an expression effect.

credible_set_member binds member-specific measurements to its own study and variant. Its P-value mantissa/exponent, beta, posteriorProbability, and standardError must not be replaced by lead-level or other_reported_statistics values. A member posterior probability concerns that fine-mapping analysis; it is not a causal-gene probability.

A colocalization record may additionally contain right_study. Keep study, right_study, method, and the reported H3/H4/CLPP together. The queried variant and credible_set_member establish the route to that signal comparison, not a license to reinterpret every colocalization statistic as a variant-specific result. Multiple displayed member bindings can refer to the same study-pair result.

variant records identify the exact variant_id and origin. origin=source_selected denotes an uploaded selected source; origin=ld_proxy denotes a proxy. variant.ld_relations records the source-proxy relationship, r2, population, and other supplied reference details. Do not assign a source GWAS P value, beta, or odds ratio to a proxy, or count proxies as additional uploaded significant SNPs. Do not infer an LD relationship absent from the supplied fields. Bind r2, population, genome build, and source/proxy identities to the same recorded edge; a shared proxy can have different relationships to different source SNPs. Missing scope is not permission to infer an edge from genomic proximity.

When analysis_scope or ld_expansion supplies window_bp, it is the search distance on each side of a source SNP, not the total width. Use +/- that recorded distance or explicitly say "on each side"; a total span is twice the value. Do not confuse this LD search distance with a gene/TSS distance or assume a numerical window that is not supplied.

### Regulatory and Positional Summaries

regulatory_groups organize comparable records by source_id, dataset, method, model, model_version, context_match_class, and regulatory_element_type. A group may report relationship_count, source_selected_relationship_count, ld_proxy_relationship_count, other_variant_relationship_count, score_range, distance_to_tss_range, context_distribution, interval_type_counts, unique_interval_count, and independent_experiment_count.

These counts describe represented records and relationships, not causal votes or independent experiments. A null independent_experiment_count means unknown. A score range is descriptive within its reported group, not a common probability scale across datasets or a calibrated causal-gene posterior. Missing method or version fields do not establish methodological equivalence.

selected_relationships is the authoritative list of individually displayed links. display_mode=all_relationships retains every eligible link in a small supplied set; display_mode=representatives selects links from a larger set. displayed_relationship_count and summarized_relationship_count distinguish the two. selection_limits records display budgets; flagged evidence is exempt, and budget_exceeded_to_preserve_flags explains any excess. representatives contains compatibility pointers into selected_relationships, not additional observations. qualified_or_conflicting_evidence also points to retained flagged observations and must not be counted twice. Resolve each link's own variant, variant_overlap, regulatory_annotation, study, statistics, and evidence_refs.

Prefer exact, attributable SNP-interval-gene relationships when comparing regulatory explanations. A displayed link supports only its recorded variant and gene; representative selection cannot validate undisplayed relationships. score_comparison_within_group_supported states whether within-group score ordering is supported. Never compare confidence values across distinct methods, models, versions or scales as calibrated probabilities.

Use exact_variant_overlap and the original interval identity/type where supplied. Do not confuse distance_to_tss with distance_from_footprint. A coordinate-derived regulatory element key is a traceable local identifier, not an externally validated element classification.

positional_summary separates selected-source and proxy position records, with a nearest annotation and distance_from_footprint_range when available. explicit_coding_splicing_fact_count records supplied consequence facts. Neither nearest status, footprint distance, nor promoter overlap alone establishes gene causality.

### Background and Coverage

background_summary contains function, expression, pathway, and literature summaries. selected entries link to citation_records.selected_background, which contains the actual displayed observation. context_selection_basis states how each family was matched: expression uses the frozen biosample mapping, while pathway and literature text relevance is not biosample identity verification. matched_context_terms does not prove phenotype relevance. Use an expression item's own tissue/cell identity rather than assigning the whole profile's tissue scope to one measurement.

For expression references, context_assessment.scope=selected_background_items means that item_assessments applies separately to each retained measurement. selected_background_index is one-based and joins the corresponding selected_background item. Tissue and cell-type identities are separate axes; a matching cell type does not change that measurement's reported organ or tissue. Do not replace item-specific context with a profile-wide biosample label.

reported_record_count, context_matching_item_count, selected_item_count, selection_limit, and unselected_content_retained_in_ledger describe selection and display. Unshown background content is not negative evidence; do not claim to have inspected it.

Card coverage, gene_comparison.coverage, and evidence_projection describe the supplied representation. In particular, citation_visibility_is_retrieval_coverage=false means that fewer individually cited variants do not establish failed LD retrieval. all_direct_molecular_facts_retained applies to the scientific view provided to card construction, not every possible database result. Membership and aggregation hashes support traceability; they are neither readable raw observations nor citations.

Distinguish successful queries with no returned matches from failed/incomplete queries and from records represented by summaries. A successful empty result supports only a statement about that query. Missing colocalization records do not demonstrate absence of colocalization, and compressed display does not demonstrate missing retrieval. Use the supplied coverage statements to bound the conclusion.

availability reports each family's query_status, module_statuses, retained_fact_count, displayed_item_count, evidence_status, and missing_semantics. Query completion describes the recorded module scope, not exhaustive gene-level database coverage. unknown or not_run is not no_data; failed or partial is not a successful negative query. A retained observation can still be used if another query in the family failed, with that scope limitation. An empty display can also reflect summarization or a context filter, so inspect retained and displayed counts separately.

Optional LD expansion and molecular-evidence coverage are separate. When the selected source SNPs are valid, skipped/unverified added proxies or an incomplete optional LD search are scope information, not automatic scientific warnings about those SNPs, the gene ordering, or the report. Use only validated source/proxy evidence and do not claim that the expanded scope is exhaustive. This does not excuse an incorrect stated LD pair/value or suppress an independently established problem with a selected source SNP.
'''

[prompts.agent_v2g_card_contract]
version = "3.3.0"
role = "system_fragment"
purpose = "Part 4: explain the GWASMind 4.0 gene-centric evidence cards (one per lead-window gene) and their citable evidence references."
stage = "candidate_gene_ranking"
lifecycle = "runtime"
input_context = "gwasmind_v2g_gene_cards_v1: one comparison card per lead-window gene with auxiliary positional facts, categorized evidence and E-numbered evidence references."
placeholders = {}
parameter_bindings = {}
output_contract = "Exactly one JSON object: ranked_genes (gene_id/evidence_ids/rationale/limitations), claims (text/evidence_ids), and summary."
constraints = ["Cite only E references shown on the card of the gene being discussed.", "A failed, partial or not_requested category is unknown, not negative evidence.", "The evidence tier is a label, not a ranking."]
call_sites = ["src/gwasmind/llm.py:_initial_ranking_system_prompt"]
content = '''
## 4. Evidence Card Field Guide

The gwasmind_v2g_gene_cards_v1 payload in gene_comparison.comparison_cards contains every candidate, with its gene_id, symbol/name when available, auxiliary position and evidence categories. No tier or precomputed rank is supplied. The frozen Context in locus.biological_context is shared background; judge tissue/cell compatibility from the original identities.

Category tables use gwasmind_v2g_table_v1: zip columns to each row and restore constant_fields. A dollar-prefixed missing marker means an absent field; null means explicitly unreported. Current product requests use no shared-reference dictionary. Legacy requests with a dollar-prefixed ref marker resolve it through shared_definitions. Table positions and definition IDs are not citations.

coding contains consequences. qtl lists every cis molecular QTL credible set that shares a member with the uploaded or verified LD-linked variants and has credible-set lead P < 0.001; no qualifying credible set is withheld. This user-configured exploratory cutoff is not an FDR claim. cs_lead_measurement binds P and beta to cs_lead_variant_id, which can be outside the local set. uploaded_members names the uploaded variants inside the credible set and locus_witness_count counts all its analysis-variant members. When no uploaded variant is a member, locus_anchor_witnesses keeps one LD-linked member with its inline ld_links as the membership route. Never copy lead statistics onto a member. Inline ld_links beside a variant bind the exact selected_variant_id/proxy_variant_id pair, r2, population and genome_build. Legacy r2_to_anchor scalars are not authorization for arbitrary pairwise LD claims.

Each qtl row also summarizes all colocalization of that credible set per phenotype: coloc_phenotypes lists each target or related phenotype identity (phenotype_id from locus.biological_context.phenotype_scope, target first) with the number of distinct GWAS studies of that phenotype and the maximum H4; coloc_best_pair is the highest-priority target or related pair, citable through its evidence_id; coloc_other_phenotypes counts the distinct other phenotypes with coloc_other_max_h4. Several studies of one phenotype are repeated measurements of one trait, not additional phenotypes, and one QTL signal tested against many GWAS entries is one signal, not independent confirmations.

coloc.phenotype_summary gives, per target or related phenotype, the number of QTL signals and distinct GWAS studies that colocalize with this gene and the maximum H4. coloc records are representative external GWAS-QTL pairs meeting the supplied threshold (default H4 >= 0.5 for exploratory retention), at most one per QTL signal and phenotype; the qtl rows summarize every pair. represented_phenotype_ids assigns individual phenotypes to each representative; gwas_diseases preserves original study mappings and may overlap other rows. coloc_best_pair carries its GWAS study-locus ID and method; its enclosing QTL supplies the molecular study-locus ID. Preserve phenotype_scope, method, biosample and both study-locus identities. H4 near 0.5 is tentative; retention is not a declaration of strong evidence. other_phenotype_summary gives the gene's number of QTL signals and distinct other phenotypes, not individual disease mechanisms. These are external study results, not newly computed colocalization of the uploaded GWAS.

e2g lists every predicted interval-to-gene link with exact locus-variant overlap that passed its source threshold; ENCODE-rE2G uses its OT inclusion threshold (default 0.6) and other sources retain their recorded method and threshold. Preserve interval_type (including promoter, genic or intergenic); a prediction does not establish two experimentally measured loop anchors. The upstream strongest-per-variant-gene-biosample collapse is deduplication, not independent evidence.

Every QTL, coloc and E2G category has a summary with total_records, displayed_records and omitted_records. QTL and E2G are complete (displayed_records equals total_records); only coloc pairs are representative, and their totals appear on the qtl rows. Counts are descriptive, not causal votes; many rows can repeat one signal across tissues, cell types or studies.

expression, constraint, association and function provide background. Expression abundance is rounded to three significant digits; specificity is not moved across its reported threshold. Disease associations use named target/related phenotypes. OT L2G-derived components and aggregates containing them are excluded. Europe PMC is literature co-occurrence, not locus evidence; overall and component scores are not independent supports.

Status distinguishes observed, not_observed (successful retrieval with no retained results), partial, failed and not_requested. Incomplete queries are unknown. Each citable record has evidence_id; gene-level categories have evidence_ids. Only displayed E references on the owning gene's card authorize citations. Missing references remain uncitable context. Preserve numeric ownership, original limitations and uncertainty; the application has not chosen the shortlist or ranking.
'''

