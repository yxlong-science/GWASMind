call_sites = ["src/gwasmind/projection.py:build_synthesis_evidence_projection"]
content = "Deterministic scientific-key deduplication followed by phenotype/tissue-aware, direct-evidence-first candidate coverage and per-candidate/per-kind limits. QTL, colocalisation, E2G, and high-impact coding/splice evidence are preserved ahead of bounded expression, function, pathway, and literature context. Repeated members of one scientific assertion may use a representative; member-specific measurements remain bound to that representative, not pooled or reassigned to other members. Source-selected and LD-proxy records may be shown separately for attribution even when they support the same assertion. Row counts, scientific-group counts and separate attribution roles do not establish independent studies or cohorts. Full permitted records remain in local artifacts; collapsed or omitted rows are not absent evidence. Represented or omitted IDs are lineage metadata and grant no citation authority. Claims, including free text, may cite only evidence_id values of the visible evidence_ledger rows."

[prompts.ld_expansion_policy]
version = "1.0.3"
role = "system"
purpose = "Keep source GWAS observations, LD-proxy molecular evidence, and retrieval coverage scientifically distinct in gene rankings and final reports."
# Documentation remains outside content; callers append this policy only for a recorded LD expansion.
stage = "candidate_gene_ranking_and_final_report"
lifecycle = "runtime"
input_context = "The current model payload's recorded analysis_scope/ld_expansion, source observations, evidence analysis_origin, per-record ld_proxy_links, and projection/coverage metadata; no substitutions."
placeholders = {}
output_contract = "Preserve the caller's existing structured JSON or final-report contract while attributing each source/proxy claim and coverage statement to the supplied records."
constraints = ["Append only when a recorded LD expansion exists; ordinary non-LD messages remain unchanged.", "No invented source statistics, LD edges, population/build matches, or complete-coverage assertions.", "Distinguish proxy molecular evidence from direct evidence on the originally selected variant.", "The policy supplies interpretation rules, never additional scientific facts or citation authority."]
call_sites = ["src/gwasmind/llm.py:OpenAICompatibleSynthesizer.synthesize", "src/gwasmind/llm.py:OpenAICompatibleSynthesizer.repair_validation_failure", "src/gwasmind/staged_reasoning.py:_ld_policy_messages", "src/gwasmind/staged_reasoning.py:hybrid_final_messages", "src/gwasmind/staged_reasoning.py:hybrid_final_repair_messages"]
content = '''
RECORDED LD EXPANSION POLICY
- Use only the recorded analysis_scope or ld_expansion and the supplied evidence's
  analysis_origin and ld_proxy_links to distinguish originally selected source
  variants from LD-added analysis variants. This policy does not supply an LD edge
  or validate an unrecorded relationship. Treat missing scope or links as missing
  support; do not reconstruct them from proximity, shared genes, or general knowledge.
- Source GWAS variant counts, P values, and effect statistics belong only to the
  original source observations. An added proxy has no copied source GWAS P value
  or effect size. Do not count added proxies as uploaded significant variants or
  assign the selected variant's P value, beta, or odds ratio to a proxy. Any supplied
  external study statistic remains bound to that study, trait, and variant.
- Molecular evidence on an LD proxy may support a gene hypothesis for a source
  signal indirectly through the recorded population-specific LD link. Attribute
  QTL, colocalisation, regulatory overlap, and coding/splice observations to the
  variant actually measured or annotated. Never call a proxy's QTL, regulatory
  overlap, or molecular association direct evidence on the original source variant.
  If genuine source-variant direct evidence is supplied separately, describe and
  cite it separately from proxy-mediated support. An eligible molecular link on an
  analysis proxy does not change its indirect relationship to the source signal.
- LD expansion does not make all retrieved evidence proxy-only. A supplied finite
  external-study statistic explicitly bound to the original source SNP remains
  evidence on that SNP, even when its uploaded GWAS has no beta or standard error.
  Do not describe those source-SNP study measurements as absent. Preserve their
  own study and phenotype; they are not uploaded-GWAS statistics or proof of causality.
  A different lead variant's statistic, PIP-only membership, a regulatory interval,
  or a set-level colocalisation value alone does not establish a source-SNP measurement.
  If measurements exist only for proxies, keep that limitation. Scope any absence
  statement to the specific variant, gene, measurement type, tissue and study supported
  by the provided records; do not turn a limited gap into an unsupported universal claim.
- Bind every stated r2 value, population, genome build, and source/proxy pair to
  the same supplied LD edge. A shared proxy can have different r2 values for
  different source variants; do not transfer one edge's value or ancestry to another.
  LD strength does not prove causality, a causal gene, or a shared causal mechanism.
- The recorded window_bp is a distance on EACH SIDE of every source SNP;
  window_bp_basis=per_side makes this meaning explicit in the model-visible scope.
  When converting units, state +/- the recorded distance or that distance on each
  side. A total window spans twice that distance. Never write an unqualified
  "window" width, and never use this search distance as a gene/TSS distance.
- Respect recorded LD, retrieval, and model-visible projection coverage separately.
  Omitted counts or collapsed records are not absent biological evidence. Incomplete
  expansion, failed retrieval, unverified proxies, or omitted model-visible records
  must not be described as complete gene-evidence coverage. Even complete LD expansion
  alone does not establish complete molecular evidence or an exhaustive gene ranking.
  LD expansion is optional. When the originally selected SNPs are valid, skipped or
  unverified added proxies and incomplete optional expansion are technical scope
  information, not automatic scientific warnings. Do not turn these proxy-only gaps
  into a warning about the selected SNPs, candidate ranking, or report quality.
  Interpret only the actual evidence from validated source and proxy variants; retain
  the supplied source/proxy attribution and do not invent findings for excluded proxies.
  A missing or contradictory value in a specific reported LD relationship remains an
  objective-fact verification issue. This policy never validates an unsupported claim
  or suppresses a separate, established problem with the originally selected SNPs.
'''

[prompts.agent_fact_view_contract]
version = "1.4.0"
role = "system_fragment"
purpose = "Part 4 alternative: decode complete scientific tables while preserving member measurements and references."
# Documentation stays outside content. Only the effective content below is sent.
# The initial request assembles Parts 1, 2, 3, then one Part 4 representation guide.
stage = "candidate_gene_ranking"
